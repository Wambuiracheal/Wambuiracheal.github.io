<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon lives in /public and is served from the site root. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Racheal Wambui Njuguna — Fullstack Software Engineer specializing in Frontend Development. React, Vue, TypeScript, Tailwind CSS. Based in Nairobi, Kenya."
    />
    <meta name="author" content="Racheal Wambui Njuguna" />

    <!-- Open Graph: the title/description shown when the link is shared on social media. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Racheal Wambui Njuguna — Software Engineer" />
    <meta
      property="og:description"
      content="Fullstack Software Engineer specializing in Frontend Development. React, Vue, TypeScript, Tailwind CSS."
    />

    <!-- Google Fonts: Sora for headings, Inter for body text (see --font-* in style.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Racheal Wambui Njuguna — Software Engineer</title>

    <!-- Apply the saved theme/accent before the page paints, to avoid a flash
         of the wrong theme (see src/composables/useTheme.js). -->
    <script>
      ;(function () {
        var t, a
        try {
          t = localStorage.getItem('theme')
          a = localStorage.getItem('accent')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
        if (a) document.documentElement.setAttribute('data-accent', a)
      })()
    </script>
  </head>
  <body>
    <!-- Vue mounts the whole app here (src/main.js). -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
